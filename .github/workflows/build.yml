name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: DSP test
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/wb_test_artefacts/Release/wb_test
      - uses: actions/upload-artifact@v4
        with:
          name: WIFEBEATER-${{ runner.os }}
          path: |
            build/WIFEBEATER_artefacts/Release/VST3
            build/WIFEBEATER_artefacts/Release/AU
            build/WIFEBEATER_artefacts/Release/Standalone
